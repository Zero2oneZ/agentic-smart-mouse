[package]
name = "hotbox-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Deterministic segmented workflow and delegation kernel for Hotbox"

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
