<!doctype html><html lang="en"><meta charset="utf-8"><title>Hotbox recording</title>
<style>body{font:14px system-ui;background:#15181e;color:#e4e7ed;width:330px;padding:18px}button,a{display:block;box-sizing:border-box;width:100%;margin:12px 0;padding:10px;color:inherit;background:#252c37;border:1px solid #566071;border-radius:7px;text-align:center}p{line-height:1.5}small{color:#adb7c6}a[hidden]{display:none}</style>
<h2>Record a workflow</h2><p id="status" role="status">Checking…</p>
<p>Only this selected tab. Field names and actions are saved; typed values, passwords and cookies are excluded.</p>
<button id="start">Start recording this tab</button><button id="stop">Stop recording</button><button id="export">Export for Hotbox</button><a id="download" hidden download="hotbox-browser-recording.json">Save recording</a>
<small>Import the saved recording in Hotbox → Teach a helper. Review before making a helper draft. Keep exported files private.</small>
<script type="module" src="popup.js"></script></html>
